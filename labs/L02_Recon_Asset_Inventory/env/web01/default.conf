server {
    listen 80;
    server_name web01;

    # server_tokens on -> nginx reports its version in the "Server:" response
    # header. Left on deliberately: this mirrors a very common real-world
    # default, and it means the version comes from the server itself rather
    # than from a scanner's fingerprint guess.
    server_tokens on;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }
}

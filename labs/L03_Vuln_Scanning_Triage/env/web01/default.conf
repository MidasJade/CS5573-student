server {
    listen 80;
    server_name web01;

    # server_tokens on -> nginx reports its version in the "Server:" response
    # header. Left on deliberately: a very common real-world default.
    server_tokens on;

    root  /usr/share/nginx/html;
    index index.html;

    location / {
    }

    # Directory listing enabled for this location. The operators turned it on
    # once to share a file and never turned it back off.
    location /backup/ {
        autoindex on;
        autoindex_exact_size off;
    }

    # HTTP basic auth on the admin area.
    location /admin/ {
        auth_basic           "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }
}
